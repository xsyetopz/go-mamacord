# yaml-language-server: $schema=https://json.schemastore.org/golangci-lint

# golangci-lint v2 strict quality baseline.
#
# Replace github.com/xsyetopz/go-mamacord w/ your module path.
#
# Policy:
# - noise is allowed;
# - quality, correctness, security, maintainability, API hygiene, && performance are CI gates;
# - dedicated linters stay dedicated for precise //nolint ownership;
# - revive is additive, ! a replacement bucket;
# - deprecated/replaced linters are ! enabled.

version: "2"

run:
  relative-path-mode: gomod
  modules-download-mode: readonly
  tests: true
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

output:
  sort-order:
    - file
    - linter
    - severity

formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
      custom-order: true

    gofumpt:
      module-path: github.com/xsyetopz/go-mamacord
      extra-rules: true

    goimports:
      local-prefixes:
        - github.com/xsyetopz/go-mamacord

    golines:
      max-len: 120
      tab-len: 4
      shorten-comments: true
      reformat-tags: true
      chain-split-dots: true

  exclusions:
    generated: strict
    warn-unused: true

linters:
  default: none

  enable:
    # Correctness / likely bugs.
    - asasalint
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - durationcheck
    - err113
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - exhaustruct
    - fatcontext
    - forcetypeassert
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocritic
    - govet
    - ineffassign
    - makezero
    - mirror
    - nilerr
    - nilnesserr
    - nilnil
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - wastedassign

    # Security / unsafe edge cases.
    - asciicheck
    - bidichk
    - gosec
    - noctx
    - nosprintfhostport

    # Complexity / maintainability / duplication / constants.
    - cyclop
    - dupl
    - funlen
    - gocognit
    - goconst
    - gocyclo
    - lll
    - maintidx
    - mnd
    - nestif

    # Performance && modern standard-library use.
    - exptostd
    - intrange
    - modernize
    - perfsprint
    - prealloc
    - unqueryvet
    - usestdlibvars

    # Go/API/style checks.
    - canonicalheader
    - decorder
    - depguard
    - dogsled
    - dupword
    - embeddedstructfieldcheck
    - errname
    - forbidigo
    - funcorder
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - gosmopolitan
    - grouper
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - iotamixing
    - ireturn
    - loggercheck
    - misspell
    - musttag
    - nakedret
    - nlreturn
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - paralleltest
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - revive
    - sloglint
    - spancheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting
    - varnamelen
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint

  settings:
    copyloopvar:
      check-alias: true

    cyclop:
      max-complexity: 10
      package-average: 5.0

    decorder:
      dec-order:
        - type
        - const
        - var
        - func
      ignore-underscore-vars: false
      disable-dec-order-check: false
      disable-init-func-first-check: false
      disable-dec-num-check: false

    depguard:
      rules:
        deprecated:
          files:
            - "$all"
          deny:
            - pkg: github.com/golang/protobuf
              desc: Use google.golang.org/protobuf instead.

            - pkg: github.com/satori/go.uuid
              desc: Use github.com/google/uuid instead.

            - pkg: github.com/gofrs/uuid$
              desc: Use github.com/gofrs/uuid/v5 || later.

        prefer-cgo-free:
          files:
            - "$all"
          deny:
            - pkg: github.com/mattn/go-sqlite3
              desc: Use modernc.org/sqlite, github.com/ncruces/go-sqlite3, || github.com/glebarez/go-sqlite.

            - pkg: gorm.io/driver/sqlite
              desc: Use github.com/glebarez/sqlite for CGO-free GORM SQLite.

            - pkg: github.com/confluentinc/confluent-kafka-go
              desc: Use github.com/twmb/franz-go/pkg/kgo || github.com/segmentio/kafka-go unless librdkafka is required.

            - pkg: gopkg.in/confluentinc/confluent-kafka-go.v1
              desc: Use github.com/twmb/franz-go/pkg/kgo || github.com/segmentio/kafka-go.

            - pkg: github.com/DataDog/zstd
              desc: Use github.com/klauspost/compress/zstd.

            - pkg: github.com/tecbot/gorocksdb
              desc: Use github.com/cockroachdb/pebble, github.com/dgraph-io/badger/v4, github.com/syndtr/goleveldb/leveldb, || go.etcd.io/bbolt.

            - pkg: github.com/linxGnu/grocksdb
              desc: Use github.com/cockroachdb/pebble, github.com/dgraph-io/badger/v4, github.com/syndtr/goleveldb/leveldb, || go.etcd.io/bbolt.

            - pkg: github.com/jmhodges/levigo
              desc: Use github.com/syndtr/goleveldb/leveldb || github.com/cockroachdb/pebble.

            - pkg: github.com/mattn/go-oci8
              desc: Use github.com/sijms/go-ora/v2 unless OCI/Instant Client behavior is required.

            - pkg: github.com/godror/godror
              desc: Use github.com/sijms/go-ora/v2 unless ODPI-C/Instant Client behavior is required.

            - pkg: github.com/pebbe/zmq4
              desc: Use github.com/go-zeromq/zmq4 when pure-Go ZeroMQ compatibility is sufficient.

            - pkg: gopkg.in/zeromq/goczmq.v4
              desc: Use github.com/go-zeromq/zmq4 when pure-Go ZeroMQ compatibility is sufficient.

        non-test-files:
          files:
            - "!$test"
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead.

        non-main-files:
          files:
            - "!**/main.go"
          deny:
            - pkg: log$
              desc: Use log/slog instead.

    dogsled:
      max-blank-identifiers: 2

    dupl:
      threshold: 100

    dupword:
      comments-only: false

    embeddedstructfieldcheck:
      empty-line: true
      forbid-mutex: true

    errcheck:
      check-type-assertions: true
      check-blank: true
      disable-default-exclusions: true

    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: false

    exhaustruct:
      exclude:
        - ^net/http.Client$
        - ^net/http.Cookie$
        - ^net/http.Request$
        - ^net/http.Response$
        - ^net/http.Server$
        - ^net/http.Transport$
        - ^net/url.URL$
        - ^os/exec.Cmd$
        - ^reflect.StructField$
        - ^github.com/Shopify/sarama.Config$
        - ^github.com/Shopify/sarama.ProducerMessage$
        - ^github.com/mitchellh/mapstructure.DecoderConfig$
        - ^github.com/prometheus/client_golang/.+Opts$
        - ^github.com/spf13/cobra.Command$
        - ^github.com/spf13/cobra.CompletionOptions$
        - ^github.com/stretchr/testify/mock.Mock$
        - ^github.com/testcontainers/testcontainers-go.+Request$
        - ^github.com/testcontainers/testcontainers-go.FromDockerfile$
        - ^golang.org/x/tools/go/analysis.Analyzer$
        - ^google.golang.org/protobuf/.+Options$
        - ^gopkg.in/yaml.v3.Node$
      allow-empty-returns: true

    fatcontext:
      check-struct-pointers: true

    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
          msg: Use structured logging || testing output.
        - pattern: ^fmt\.Print(f|ln)?$
          msg: Use structured logging, explicit writer output, || testing output.
        - pattern: ^spew\.Dump$
          msg: Remove debug dumping from production code.
      exclude-godoc-examples: false
      analyze-types: true

    funcorder:
      constructor: true
      struct-method: true
      alphabetical: false
      function: true

    funlen:
      lines: 60
      statements: 40
      ignore-comments: true

    gochecksumtype:
      default-signifies-exhaustive: false
      include-shared-interfaces: true

    gocognit:
      min-complexity: 10

    goconst:
      min-len: 2
      min-occurrences: 2
      match-constant: true
      numbers: false
      find-duplicates: true
      eval-const-expressions: true
      ignore-tests: false

    gocritic:
      settings:
        captLocal:
          paramsOnly: false
        underef:
          skipRecvDeref: false

    gocyclo:
      min-complexity: 10

    godoclint:
      default: all

    godot:
      scope: all
      period: true
      capital: false

    godox:
      keywords:
        - TODO
        - BUG
        - FIXME
        - HACK
        - XXX
        - OPTIMIZE

    gomoddirectives:
      replace-local: false
      retract-allow-no-explanation: false
      exclude-forbidden: true
      ignore-forbidden: true
      go-debug-forbidden: true
      check-module-path: true

    gomodguard_v2:
      local-replace-directives: true

      blocked:
        # Deprecated / abandoned / wrong major path.
        - module: github.com/golang/protobuf
          recommendations:
            - google.golang.org/protobuf
          reason: Deprecated protobuf module.

        - module: github.com/satori/go.uuid
          recommendations:
            - github.com/google/uuid
          reason: Unmaintained UUID module.

        - module: github.com/gofrs/uuid
          recommendations:
            - github.com/gofrs/uuid/v5
          reason: Use the Go-module-aware v5 module path.

        # SQLite: avoid CGO-bound sqlite by default.
        - module: github.com/mattn/go-sqlite3
          recommendations:
            - modernc.org/sqlite
            - github.com/ncruces/go-sqlite3
            - github.com/glebarez/go-sqlite
            - github.com/go-again/sqlite
          reason: Prefer CGO-free SQLite for static builds, cross-compilation, && simpler CI.

        - module: gorm.io/driver/sqlite
          recommendations:
            - github.com/glebarez/sqlite
          reason: The default GORM SQLite driver uses mattn/go-sqlite3; prefer the pure-Go GORM SQLite driver.

        # Kafka: avoid librdkafka/cgo wrapper unless explicitly required.
        - module: github.com/confluentinc/confluent-kafka-go
          recommendations:
            - github.com/twmb/franz-go
            - github.com/segmentio/kafka-go
          reason: Prefer pure-Go Kafka clients unless librdkafka-specific behavior is required.

        - module: gopkg.in/confluentinc/confluent-kafka-go.v1
          recommendations:
            - github.com/twmb/franz-go
            - github.com/segmentio/kafka-go
          reason: Prefer pure-Go Kafka clients && avoid legacy gopkg.in module path.

        # Zstandard: avoid CGO zstd bindings.
        - module: github.com/DataDog/zstd
          recommendations:
            - github.com/klauspost/compress
          reason: Prefer github.com/klauspost/compress/zstd, a pure-Go zstd implementation.

        # RocksDB / LevelDB C bindings.
        - module: github.com/tecbot/gorocksdb
          recommendations:
            - github.com/cockroachdb/pebble
            - github.com/dgraph-io/badger/v4
            - github.com/syndtr/goleveldb
            - go.etcd.io/bbolt
          reason: Prefer Go-native embedded storage unless RocksDB compatibility is a hard requirement.

        - module: github.com/linxGnu/grocksdb
          recommendations:
            - github.com/cockroachdb/pebble
            - github.com/dgraph-io/badger/v4
            - github.com/syndtr/goleveldb
            - go.etcd.io/bbolt
          reason: Prefer Go-native embedded storage unless RocksDB compatibility is a hard requirement.

        - module: github.com/jmhodges/levigo
          recommendations:
            - github.com/syndtr/goleveldb
            - github.com/cockroachdb/pebble
          reason: Prefer Go-native LevelDB/RocksDB-style storage.

        # Oracle: avoid Instant Client / CGO dependency by default.
        - module: github.com/mattn/go-oci8
          recommendations:
            - github.com/sijms/go-ora/v2
          reason: Prefer pure-Go Oracle connectivity unless OCI-specific behavior is required.

        - module: github.com/godror/godror
          recommendations:
            - github.com/sijms/go-ora/v2
          reason: Prefer pure-Go Oracle connectivity unless Oracle Instant Client / ODPI-C behavior is required.

        # ZeroMQ: avoid libzmq bindings by default.
        - module: github.com/pebbe/zmq4
          recommendations:
            - github.com/go-zeromq/zmq4
          reason: Prefer pure-Go ZeroMQ when protocol compatibility is sufficient.

        - module: gopkg.in/zeromq/goczmq.v4
          recommendations:
            - github.com/go-zeromq/zmq4
          reason: Prefer pure-Go ZeroMQ over CZMQ/libzmq bindings.

    govet:
      enable-all: true
      disable:
        # Use fieldalignment as a profiling/report tool, ! a universal CI gate.
        - fieldalignment
      settings:
        shadow:
          strict: true

    iface:
      enable:
        - identical
        - unused
        - opaque
        - unexported

    importas:
      no-unaliased: true
      no-extra-aliases: true

    inamedparam:
      skip-single-param: false

    interfacebloat:
      max: 5

    iotamixing:
      report-individual: true

    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - "(or|er)$"

    lll:
      line-length: 120
      tab-width: 1

    maintidx:
      under: 30

    makezero:
      always: true

    misspell:
      mode: restricted

    mnd:
      checks:
        - argument
        - case
        - condition
        - operation
        - return
        - assign
      ignored-numbers:
        - "2"
        - "0600"
        - "0644"
        - "0666"
        - "0755"
        - "0o600"
        - "0o644"
        - "0o666"
        - "0o755"
      ignored-functions:
        - args.Error
        - flag.Arg
        - flag.Duration.*
        - flag.Float.*
        - flag.Int.*
        - flag.Uint.*
        - os.Chmod
        - os.Mkdir.*
        - os.OpenFile
        - os.WriteFile
        - prometheus.ExponentialBuckets.*
        - prometheus.LinearBuckets

    nakedret:
      max-func-lines: 0

    nestif:
      min-complexity: 4

    nilnil:
      only-two: false
      detect-opposite: true
      checked-types:
        - chan
        - func
        - iface
        - map
        - ptr
        - uintptr
        - unsafeptr

    nlreturn:
      block-size: 2

    nolintlint:
      allow-no-explanation: []
      require-explanation: true
      require-specific: true
      allow-unused: false

    perfsprint:
      err-error: true
      loop-other-ops: true
      strconcat: true
      error-format: false # https://github.com/catenacyber/perfsprint/issues/62

    prealloc:
      simple: true
      range-loops: true
      for-loops: true

    predeclared:
      ignore: []
      qualified-name: true

    reassign:
      patterns:
        - ".*"

    rowserrcheck:
      packages:
        - github.com/jmoiron/sqlx

    revive:
      severity: error
      enable-default-rules: true
      confidence: 0.1
      directives:
        - name: specify-disable-reason
          severity: error
      rules:
        - name: argument-limit
          arguments:
            - 5
        - name: atomic
        - name: bool-literal-in-expr
        - name: call-to-gc
        - name: confusing-naming
        - name: confusing-results
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: datarace
        - name: defer
        - name: early-return
        - name: empty-block
        - name: empty-lines
        - name: enforce-switch-style
        - name: errorf
        - name: flag-parameter
        - name: function-result-limit
          arguments:
            - 3
        - name: get-return
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: if-return
        - name: imports-blocklist
          arguments:
            - crypto/md5
            - crypto/sha1
        - name: increment-decrement
        - name: indent-error-flow
          arguments:
            - preserve-scope
        - name: inefficient-map-lookup
        - name: max-control-nesting
          arguments:
            - 3
        - name: modifies-parameter
        - name: modifies-value-receiver
        - name: nested-structs
        - name: optimize-operands-order
        - name: range-val-address
        - name: range-val-in-closure
        - name: redundant-build-tag
        - name: redundant-import-alias
        - name: string-of-int
        - name: struct-tag
        - name: superfluous-else
        - name: time-equal
        - name: time-naming
        - name: unchecked-type-assertion
        - name: unconditional-recursion
        - name: unnecessary-format
        - name: unnecessary-if
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: use-any
        - name: use-errors-new
        - name: use-slices-sort
        - name: waitgroup-by-value

    sloglint:
      no-global: all
      context: all
      static-msg: true
      no-mixed-args: true
      key-naming-case: snake

    spancheck:
      checks:
        - end
        - record-error
        - set-status

    staticcheck:
      checks:
        - all

    tagalign:
      align: true
      sort: true
      order:
        - json
        - yaml
        - yml
        - toml
        - mapstructure
        - binding
        - validate
      strict: true

    tagliatelle:
      case:
        use-field-name: true
        rules:
          json: camel
          yaml: camel
          yml: camel
          toml: camel
          xml: camel
          bson: camel
          avro: snake
          mapstructure: kebab

    unconvert:
      safe: true

    unparam:
      check-exported: true

    unqueryvet:
      check-n1: true
      check-sql-injection: true
      check-tx-leaks: true

    unused:
      field-writes-are-uses: false
      post-statements-are-reads: false
      exported-fields-are-used: false
      parameters-are-used: false
      local-variables-are-used: false
      generated-is-used: false

    usestdlibvars:
      http-method: true
      http-status-code: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true

    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true

    varnamelen:
      max-distance: 6
      min-name-length: 2
      check-receiver: true
      check-return: true
      check-type-param: true
      ignore-type-assert-ok: true
      ignore-map-index-ok: true
      ignore-chan-recv-ok: true
      ignore-names:
        - db
        - fd
        - fn
        - id
        - ip
        - ok
        - r
        - rw
        - tx
        - w
        - wg
      ignore-decls:
        - t testing.T
        - b testing.B
        - f testing.F
        - tb testing.TB
        - err error
        - ctx context.Context

    whitespace:
      multi-if: true
      multi-func: true

    wrapcheck:
      report-internal-errors: true

    wsl_v5:
      allow-first-in-block: false
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 2
      cuddle-max-statements: 2

  exclusions:
    generated: strict
    warn-unused: true
